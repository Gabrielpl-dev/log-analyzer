[project]
name = "log-analyzer"
version = "0.1.0"
description = "CLI que normaliza logs JSONL/nginx/apache e produz resumo, rankings, anomalias e relatório."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
